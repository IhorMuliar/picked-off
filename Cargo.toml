[workspace]
members = ["programs/*"]
# spike/ (local-only, not in this repository) is its own workspace
exclude = ["spike"]
resolver = "2"

[profile.release]
# Small binaries = less rent to deploy. Money maths must use checked ops explicitly.
opt-level = "z"
strip = true
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
